services:
  # ADR-1 Intake Agent API
  - type: web
    name: adr1-intake-agent
    runtime: python
    buildCommand: "pip install -r adr1-intake-agent/requirements.txt"
    startCommand: "cd adr1-intake-agent && uvicorn src.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.9.18"
    healthCheckPath: /

  # ADR-4 Triage Agent API
  - type: web
    name: adr4-triage-agent
    runtime: python
    buildCommand: "pip install -r adr4-triage-agent/requirements.txt"
    startCommand: "cd adr4-triage-agent && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.9.18"
    healthCheckPath: /health

  # Workflow Backend API
  - type: web
    name: workflow-backend
    runtime: node
    buildCommand: "cd workflow-ui/backend && npm install"
    startCommand: "cd workflow-ui/backend && node server.js"
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"
      - key: ADR1_URL
        fromService:
          type: web
          name: adr1-intake-agent
          property: host
      - key: ADR4_URL
        fromService:
          type: web
          name: adr4-triage-agent
          property: host
    healthCheckPath: /health

  # Workflow Frontend (React)
  - type: web
    name: workflow-frontend
    runtime: static
    buildCommand: "cd workflow-ui/frontend && npm install && npm run build"
    staticPublishPath: workflow-ui/frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: workflow-backend
          property: host
