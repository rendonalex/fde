version: '3.8'

services:
  adr4-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ADR4_MODE=SHADOW
      - ADR4_CONFIDENCE_THRESHOLD=0.70
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
